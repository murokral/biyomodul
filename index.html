<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BİYOMODÜL</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b23440">
<link rel="apple-touch-icon" href="ikon/ikon-192.png">
<meta name="description" content="Kalp, göz ve beyin için 3B baskıya hazır, sökülebilir biyoloji modelleri ve etkileşimli rehber.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Yerlesim: ustte marka + model sekmeleri; solda 3B sahne (laboratuvar tezgahi), sagda calisma paneli (sekmeli). Telefonda ust uste. */
:root{
  --bg:#eef2f1; --panel:#ffffff; --ink:#15211f; --muted:#5b6b67; --line:#d5dfdc; --stage:#dfe7e4; --stage2:#c9d6d2;
  --accent:#b23440; --accent-ink:#ffffff; --soft:#f6f8f7; --ok:#1f7a4d; --warn:#9a6200; --bad:#b0302b;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --panel:#16201f; --ink:#e6eeec; --muted:#93a5a0; --line:#28403b; --stage:#1a2725; --stage2:#0e1514;
  --soft:#1c2826; --ok:#4cc38a; --warn:#e3a740; --bad:#ef6b62; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1716; --panel:#16201f; --ink:#e6eeec; --muted:#93a5a0; --line:#28403b; --stage:#1a2725; --stage2:#0e1514;
  --soft:#1c2826; --ok:#4cc38a; --warn:#e3a740; --bad:#ef6b62; color-scheme:dark}
body[data-model="goz"]{--accent:#2c6c9e}
body[data-model="beyin"]{--accent:#7b4fa0}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--panel)}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:800 26px/1 var(--f-display);letter-spacing:-.02em}
.brand b span{color:var(--accent)}
.brand small{color:var(--muted);font-size:13px}
nav.models{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav.models a{text-decoration:none;color:var(--ink);padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
nav.models a .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
nav.models a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{max-width:1400px;margin:0 auto;padding-block:16px 40px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:16px}
@media (max-width:900px){main{grid-template-columns:1fr}}

/* sahne */
.stagebox{position:relative;border-radius:14px;overflow:hidden;background:radial-gradient(120% 90% at 50% 35%,var(--stage),var(--stage2));min-height:420px;height:min(72vh,720px);border:1px solid var(--line)}
@media (max-width:900px){.stagebox{height:62vh;min-height:360px}}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.hud .tag{pointer-events:auto;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:62%}
.hud .tag h1{font:700 20px/1.15 var(--f-display);margin:0;text-wrap:balance}
.hud .tag p{margin:2px 0 0;color:var(--muted);font-size:13px}
.scale{font:500 12px var(--f-mono);color:var(--muted);align-self:flex-start;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 9px;pointer-events:auto}
#markers{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:2px solid #fff;background:var(--accent);color:#fff;
  width:24px;height:24px;border-radius:50%;font:600 11px/20px var(--f-mono);text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:opacity .2s, transform .15s;padding:0}
.mk:hover,.mk.on{transform:translate(-50%,-50%) scale(1.22)}
.mk.hid{opacity:.22}
.mk.on{background:#111;border-color:var(--accent)}
.mk.found{background:var(--ok)}
.mk .lb{position:absolute;left:28px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--panel);color:var(--ink);border:1px solid var(--line);
  font:600 12px var(--f-body);padding:2px 8px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .15s}
.mk:hover .lb,.mk.on .lb,.showlabels .mk:not(.hid) .lb{opacity:1}
.quizmode .mk .lb{opacity:0!important}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600}
.tools{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tools .grp{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.tools label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tools input[type=range]{width:110px;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 11px;font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
@media (max-width:520px){.tools{gap:6px}.tools input[type=range]{width:72px}.tools .grp{padding:5px 8px}.btn{padding:6px 9px;font-size:12px}.hud .tag{max-width:70%}.hud .tag h1{font-size:17px}}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0;height:min(72vh,720px)}
@media (max-width:900px){.panel{height:auto}}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
@media (max-width:520px){#mscale{display:none}}
.btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tabs.more{-webkit-mask-image:linear-gradient(90deg,#000 84%,transparent);mask-image:linear-gradient(90deg,#000 84%,transparent)}
.tabs button{border:0;background:transparent;padding:8px 11px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.pbody{padding:16px;overflow:auto;min-height:0;flex:1}
.pbody h2{font:700 19px/1.2 var(--f-display);margin:0 0 6px;text-wrap:balance}
.pbody h3{font:700 15px/1.3 var(--f-display);margin:16px 0 6px}
.lead{color:var(--muted);margin:0 0 12px;max-width:60ch}
.list{display:flex;flex-direction:column;gap:4px;margin:8px 0 0;padding:0;list-style:none}
.list button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;border:1px solid transparent;background:transparent;padding:7px 8px;border-radius:8px;cursor:pointer}
.list button:hover{background:var(--soft)}
.list button.on{border-color:var(--accent);background:var(--soft)}
.num{font:500 11px/20px var(--f-mono);width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;flex:none}
.seen .num{background:var(--ok)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--soft)}
.card .k{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card h2{margin-top:2px}
.card p{margin:6px 0}
.card .fact{display:flex;gap:8px;font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--panel)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.steps{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:9px;border:1px solid var(--line);font-size:14px}
.steps li.cur{border-color:var(--accent);background:var(--soft)}
.steps li.done{opacity:.6}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.q b{display:block;margin-bottom:4px}
.q details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13px}
.tw{overflow-x:auto}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:13px;color:var(--muted)}
.warnbox{border-left:3px solid var(--warn);padding:8px 12px;background:var(--soft);border-radius:0 8px 8px 0;font-size:13px;margin:10px 0}
.qrbox{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
#qr{background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line);width:max-content}
input[type=text],select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px;width:100%}
.feedback{font-weight:600;min-height:1.5em}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
footer{max-width:1400px;margin:0 auto;padding-block:0 30px;color:var(--muted);font-size:12px}

#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:0;border-left:4px solid var(--c);background:var(--panel);color:var(--ink);
  font:600 11.5px var(--f-body);padding:3px 8px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.25);white-space:nowrap}
#pin{position:absolute;pointer-events:none;width:0;height:0}
#pin .ring{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;border:3px solid var(--c,var(--accent));box-shadow:0 0 0 3px rgba(255,255,255,.85);animation:pulse 1.4s ease-out infinite}
#pin .pl{position:absolute;left:22px;top:-15px;white-space:nowrap;background:var(--c,var(--accent));color:#fff;font:700 13px var(--f-body);padding:5px 10px;border-radius:7px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:.35}}
.hint{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:9px;font-size:13px;max-width:90%;text-align:center}
.cat{display:flex;align-items:center;gap:8px;font-size:12px!important;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cat::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.list .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--c)}
.list button.seen .dot{background:var(--ok);box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--ok)}
.list button.on{border-color:var(--c)}
.card{border-left:4px solid var(--c,var(--accent))}
.card .k{color:var(--c,var(--accent))}
select.mini{width:auto;padding:4px 6px;font-size:12px}
.acc{display:flex;gap:6px;flex-wrap:wrap}
.acc .btn{padding:6px 10px}
html.big body{font-size:17.5px} html.big .pbody h2{font-size:23px} html.big .pbody h3{font-size:18px} html.big .tabs button,html.big .btn,html.big .note,html.big table,html.big .lbl,html.big #pin .pl{font-size:15.5px}
html.hc{--muted:var(--ink);--line:var(--ink)} html.hc .btn,html.hc .q,html.hc .card,html.hc .panel,html.hc .stagebox{border-width:2px} html.hc a{text-decoration:underline} html.hc .tabs button[aria-selected="true"]{box-shadow:inset 0 -4px 0 var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header><div class="hrow wrap">
  <div class="brand"><b>BİYO<span>MODÜL</span></b><small>Oku, dokun, sök, keşfet.</small></div>
  <nav class="models" aria-label="Modeller">
    <a href="#kalp" data-m="kalp" style="--c:#b23440"><span class="dot"></span>Kalp</a>
    <a href="#goz" data-m="goz" style="--c:#2c6c9e"><span class="dot"></span>Göz</a>
    <a href="#beyin" data-m="beyin" style="--c:#7b4fa0"><span class="dot"></span>Beyin</a>
  </nav>
</div></header>

<main class="wrap">
  <section class="stagebox" id="stage" aria-label="3B model sahnesi">
    <canvas id="view"></canvas>
    <div id="labels" hidden></div>
    <div id="pin" hidden><span class="ring"></span><span class="pl" id="pinName"></span></div>
    <div id="hint" class="hint" hidden role="status"></div>
    <div class="loading" id="loading">Model yükleniyor…</div>
    <div class="hud">
      <div class="tag"><h1 id="mtitle">Kalp</h1><p id="msub"></p></div>
      <div class="scale" id="mscale"></div>
    </div>
    <div class="tools">
      <div class="grp"><label for="explode">Parçaları ayır</label><input type="range" id="explode" min="0" max="1" step="0.01" value="0"></div>
      <div class="grp"><label for="clip">Kesit</label><input type="range" id="clip" min="0" max="1" step="0.01" value="1"></div>
      <div class="grp"><label for="textColor">Yazılar</label><select id="textColor" class="mini"><option value="oto">Otomatik</option><option value="#111111">Siyah</option><option value="#ffffff">Beyaz</option><option value="#ffd23f">Sarı</option><option value="#1e5fd6">Mavi</option></select></div>
      <button class="btn" id="bLabels" aria-pressed="false">Tüm adlar</button>
      <button class="btn" id="bBook" aria-pressed="true">Kitaptaki görünüm</button>
      <button class="btn" id="bOuter" aria-pressed="false">Dış görünüm</button>
      <button class="btn" id="bReset">Sıfırla</button>
    </div>
  </section>

  <section class="panel" aria-label="Çalışma paneli">
    <div class="tabs" role="tablist">
      <button role="tab" data-t="kesfet" aria-selected="true">Keşfet</button>
      <button role="tab" data-t="tur">Yolculuk</button>
      <button role="tab" data-t="bul">Bul bakalım</button>
      <button role="tab" data-t="merak">Merak et</button>
      <button role="tab" data-t="indir">İndir</button>
      <button role="tab" data-t="hazirla">Hazırla</button>
      <button role="tab" data-t="ogretmen">Öğretmen</button>
    </div>
    <div class="pbody" id="pbody"></div>
  </section>
</main>
<footer class="wrap" id="foot"></footer>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="lib/DRACOLoader.js"></script>
<script src="lib/qrcode.min.js"></script>
<script>
/* ======================================================================  ICERIK  */
const OPENSTAX = {
  kalp:"https://openstax.org/books/anatomy-and-physiology-2e/pages/19-1-heart-anatomy",
  goz:"https://openstax.org/books/anatomy-and-physiology-2e/pages/14-1-sensory-perception",
  beyin:"https://openstax.org/books/anatomy-and-physiology-2e/pages/13-2-the-central-nervous-system"};
const M = {
kalp:{ ad:"Kalp", alt:"İki parça · ekranda gerçek boyut · basılı model %60 · 11. sınıf dolaşım sistemi", olcek:"Ekran 1:1 · baskı %60",
  kaynak:"Şekil: BodyParts3D, © Database Center for Life Science (DBCLS), CC BY-SA 2.1 JP. Kesit, adlar ve oklar BİYOMODÜL tarafından eklendi.",
  s:{
   sag_kulakcik:["Sağ kulakçık","Vücuttan dönen oksijence fakir kanı üst ve alt ana toplardamarlarla alır.","Kan buradan triküspit kapaktan geçerek sağ karıncığa iner."],
   sol_kulakcik:["Sol kulakçık","Akciğerlerden gelen oksijence zengin kanı akciğer toplardamarlarıyla alır.","Kalbin arka tarafında yer alır; önden bakınca büyük kısmı görünmez."],
   sag_karincik:["Sağ karıncık","Kanı akciğer atardamarıyla akciğerlere pompalar (küçük dolaşım).","Duvarı sol karıncıktan incedir, çünkü kanı yalnızca akciğerlere gönderir."],
   sol_karincik:["Sol karıncık","Kanı aort ile bütün vücuda pompalar (büyük dolaşım).","Duvarı kalbin en kalın duvarıdır; modelde kesit yüzünde bu fark görülür."],
   trikuspit:["Triküspit kapak","Sağ kulakçık ile sağ karıncık arasındaki üç yapraklı kapaktır.","Karıncık kasılınca kapanır ve kanın kulakçığa geri dönmesini önler."],

   aort:["Aort","Vücudun en büyük atardamarıdır; oksijence zengin kanı bütün vücuda taşır.","Kalpten yukarı çıkar, yay çizerek aşağı döner; yaydan baş ve kollara giden dallar ayrılır."],
   akciger_atardamari:["Akciğer atardamarı","Oksijence fakir kanı sağ karıncıktan akciğerlere taşır.","Atardamar olduğu hâlde oksijence fakir kan taşır: atardamar kalpten çıkan damardır."],
   ust_ana_toplardamar:["Üst ana toplardamar","Baş, boyun ve kollardan gelen kanı sağ kulakçığa getirir.",""],
   alt_ana_toplardamar:["Alt ana toplardamar","Gövde ve bacaklardan gelen kanı sağ kulakçığa getirir.",""],
   akciger_toplardamari:["Akciğer toplardamarları","Oksijence zengin kanı akciğerlerden sol kulakçığa getirir.","Toplardamar olduğu hâlde oksijence zengin kan taşır."],
   koroner:["Koroner damarlar","Kalp kasının kendisini besleyen damarlardır.","Bu damarların tıkanması kalp krizine (miyokart enfarktüsü) yol açar."],
   bolme:["Karıncıklar arası bölme","Sağ ve sol karıncığı ayıran kas duvarıdır.","Böylece oksijence zengin ve fakir kan karışmaz."],
   papiller:["Papiller kaslar ve kirişler","Kapak yapraklarını karıncık duvarına bağlar.","Karıncık kasılırken yaprakların kulakçığa doğru ters dönmesini önler."]},
  tur:{ad:"Kanın yolu", aciklama:"Vücuttan gelen kanın kalpten geçip yeniden vücuda gidişini adım adım izle.",
   adimlar:[["ust_ana_toplardamar","Kan vücuttan üst ve alt ana toplardamarlarla gelir."],["sag_kulakcik","Oksijence fakir kan sağ kulakçıkta toplanır."],
    ["trikuspit","Triküspit kapak açılır, kan sağ karıncığa geçer."],["sag_karincik","Sağ karıncık kasılır."],["pulmoner_kapak","Kan akciğer atardamarı kapağından geçer."],

let NOKTALAR=null;
async function loadPoints(){ if(NOKTALAR) return NOKTALAR; try{NOKTALAR=await (await fetch('modeller/noktalar.json')).json();}catch(e){NOKTALAR={kalp:{},goz:{},beyin:{}}} return NOKTALAR;}
const MODEL_URL=k=>`modeller/${k}.glb`;
function loadModel(k){
  return new Promise((res,rej)=>{ if(cache[k]) return res(cache[k]);
    loader.load(MODEL_URL(k), g=>{ g.scene.traverse(o=>{ if(!o.isMesh) return;
        if(!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
        const isText=/yazi/.test(o.name||(o.parent&&o.parent.name)||'');
        const a=o.geometry.attributes.color; let col=new THREE.Color(0xcccccc);
        if(a){ const sc=(a.array instanceof Uint8Array)?1/255:(a.array instanceof Uint16Array)?1/65535:1; col.setRGB(a.getX(0)*sc,a.getY(0)*sc,a.getZ(0)*sc); o.geometry.deleteAttribute('color'); }
        col.convertSRGBToLinear();
        let m;
        if(isText){ m=new THREE.MeshBasicMaterial({color:0x111111,side:THREE.DoubleSide,clippingPlanes:[clipPlane],polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}); m.userData.text=true; }
        else { m=new THREE.MeshLambertMaterial({color:col,side:THREE.DoubleSide,clippingPlanes:[clipPlane]});
          const nm=o.name||''; if(/kas|atardamar|toplardamar|sinir/.test(nm)){m.polygonOffset=true;m.polygonOffsetFactor=-1;m.polygonOffsetUnits=-6;}
          if(/kornea|mercek|camsi/.test(nm)){m.transparent=true;m.opacity=/camsi/.test(nm)?.3:.55;m.depthWrite=!/camsi/.test(nm);} }
        o.material=m; o.matrixAutoUpdate=true; });
      if(k==='beyin'){ try{ hipofizSapi(g.scene); }catch(e){} }
      cache[k]=g.scene; res(g.scene); }, undefined, rej); });
}

/* Hipofiz sapi: hipotalamus halkasinin altindan hipofiz halkasinin ustune iki kontur cizgisi (yazi malzemesiyle) */
function hipofizSapi(root){ const add=(half,x0)=>{ let par=null, mat=null; root.traverse(o=>{ if(o.isMesh&&o.name===half+'|yazi'){ par=o.parent; mat=o.material; } }); if(!par||!mat) return;
    [[[-2.9,15.2],[-16.3,17.6]],[[-3.3,18.6],[-16.3,21.4]]].forEach(([a,b],i)=>{ const dy=b[0]-a[0], dz=b[1]-a[1], L=Math.hypot(dy,dz);
      const g=new THREE.BoxGeometry(0.7,L,0.8); const m=new THREE.Mesh(g,mat); m.name=half+'|yazi_hipofiz_sapi_'+i;
      m.position.set(x0,(a[0]+b[0])/2,(a[1]+b[1])/2); m.rotation.x=Math.atan2(dz,dy); par.add(m); }); };
  add('sag',0.55); add('sol',0.45); }
function grpName(o){let n=o.name||''; if(!n.includes('|')&&o.parent) n=o.parent.name||''; return n.split('|')[0];}

async function show(k){
  curKey=k; document.body.dataset.model=k; loadingEl.hidden=false; loadingEl.textContent='Model yükleniyor…'; const olcT0=performance.now();
  document.querySelectorAll('nav.models a').forEach(a=>a.setAttribute('aria-current',a.dataset.m===k?'page':'false'));
  const d=M[k]; mtitle.textContent=d.ad; msub.textContent=d.alt; mscale.textContent=d.olcek; foot.textContent=d.kaynak;
  if(cur) scene.remove(cur);
  let obj; try{ obj=await loadModel(k);}catch(e){loadingEl.textContent='Model yüklenemedi. Sayfa bir web sunucusundan açılmalı (BENI_OKU dosyasına bakın).';return;}
  if(curKey!==k) return;
  cur=obj; scene.add(cur); groups={}; textMats=[];
  cur.traverse(o=>{ if(o.isMesh){ const g=grpName(o); (groups[g]=groups[g]||[]).push(o); o.userData.base=o.userData.base||o.position.clone(); o.visible=true; if(o.material.userData.text) textMats.push(o.material);} });
  setTextColor(textColorEl.value);
  const P=await loadPoints(); pts={}; const st=SET[k];
  for(const [id,p] of Object.entries(P[k]||{})){ if(!d.s[id]) continue;
    let g=(GROUP_OF[k]||{})[id];
    if(!g){ if(k==='kalp'){ const v=new THREE.Vector3(...p).sub(new THREE.Vector3(...st.planeO)); g=v.dot(new THREE.Vector3(...st.planeN))>0?'arka':'on'; }
            else if(k==='goz') g='alt'; else g=p[0]>2?'sol':'sag'; }
    pts[id]={p:new THREE.Vector3(...p),g}; const bp=(BOOKPT[k]||{})[id]; if(bp) pts[id].pb=new THREE.Vector3(...bp);
    if(k==='kalp'&&g==='on'){ const n=new THREE.Vector3(...st.planeN).normalize(), q=new THREE.Vector3(...p); q.addScaledVector(n,-q.clone().sub(new THREE.Vector3(...st.planeO)).dot(n)-0.5*0+0).addScaledVector(n,1.5); pts[id].pb=q; } }
  buildLabels(); selected=null; pin.hidden=true; explodeEl.value=0; clipEl.value=1; applyExplode(); applyClip(); bookView(true); loadingEl.hidden=true;
  if(OLC.yukleme_ms[k]===undefined) OLC.yukleme_ms[k]=Math.round(performance.now()-olcT0); olcGoster();
  setTab(curTab);
}
function offsetOf(g,t){ const e=SET[curKey].explode[g]; if(!e) return new THREE.Vector3(); return new THREE.Vector3(e[0],e[1],e[2]).normalize().multiplyScalar(e[3]*t); }
function applyExplode(){ const t=+explodeEl.value; for(const [g,arr] of Object.entries(groups)){ const off=offsetOf(g,t); arr.forEach(o=>o.position.copy(o.userData.base).add(off)); } req(); }
function applyClip(){ const st=SET[curKey]; const a=new THREE.Vector3(...st.clipAxis).normalize(); const t=+clipEl.value; const [lo,hi]=st.clipRange;
  clipPlane.normal.copy(a).negate(); clipPlane.constant= t>=0.999 ? 1e5 : lo+(hi-lo)*t; req(); }
function fitDist(){ const b=new THREE.Box3().setFromObject(cur); return b.getSize(new THREE.Vector3()).length()*1.2*Math.max(1,1.15/camera.aspect); }
function showAll(){ Object.values(groups).flat().forEach(o=>o.visible=true); }
function hideGroups(list){ Object.entries(groups).forEach(([g,arr])=>arr.forEach(o=>o.visible=!list.includes(g))); }

/* yumusak kamera gecisi (yalnizca gecis boyunca cizim) */
let anim=null;
function flyTo(target,pos,ms=650){ const t0=performance.now(), fT=controls.target.clone(), fP=camera.position.clone();
  anim={t0,ms,fT,fP,tT:target.clone(),tP:pos.clone()}; req(); }
function setCam(dir,dist,instant){ const d=new THREE.Vector3(...dir).normalize(); camera.near=dist/100; camera.far=dist*20; camera.updateProjectionMatrix();
  const P=d.multiplyScalar(dist); if(instant){ camera.position.copy(P); controls.target.set(0,0,0); controls.update(); req(); } else flyTo(new THREE.Vector3(),P); }

/* ---------------- secim isareti (tek, belirgin) ve istege bagli ad etiketleri */
const pin=document.getElementById('pin'), pinName=document.getElementById('pinName'), lblLayer=document.getElementById('labels'); let lblEls={}, selected=null;
function catColor(id){ const c=(CAT[curKey]||{})[id]; return c?CATC[curKey][c][0]:'var(--accent)'; }
function buildLabels(){ lblLayer.innerHTML=''; lblEls={};
  Object.keys(pts).forEach(id=>{ const b=document.createElement('button'); b.type='button'; b.className='lbl'; b.textContent=M[curKey].s[id][0]; b.style.setProperty('--c',catColor(id));
    b.addEventListener('click',e=>{e.stopPropagation(); onPick(id);}); lblLayer.appendChild(b); lblEls[id]=b; }); }
const tmp=new THREE.Vector3();
function ptOf(o){ return (bookMode&&o.pb)?o.pb:o.p; }
function ptGroup(o){ return (bookMode&&o.pb&&curKey==='kalp')?'arka':o.g; }
function project(id){ const o=pts[id], gg=ptGroup(o); const w=ptOf(o).clone().add(offsetOf(gg,+explodeEl.value)); tmp.copy(w).project(camera);
  const r=stage.getBoundingClientRect(); const vis=(groups[gg]||[]).some(m=>m.visible) && tmp.z<1 && !(clipEl.value<0.999 && clipPlane.distanceToPoint(w)<0);
  return {x:(tmp.x+1)/2*r.width, y:(1-tmp.y)/2*r.height, vis}; }
function updateOverlay(){
  if(selected&&pts[selected]){ const q=project(selected); pin.hidden=!q.vis; pin.style.left=q.x+'px'; pin.style.top=q.y+'px'; }
  if(showLabels){ for(const [id,el] of Object.entries(lblEls)){ const q=project(id); el.style.display=q.vis?'':'none'; el.style.left=q.x+'px'; el.style.top=q.y+'px'; } } }

function loop(now){ requestAnimationFrame(loop);
  if(anim){ let t=Math.min(1,(now-anim.t0)/anim.ms); t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    controls.target.lerpVectors(anim.fT,anim.tT,t); camera.position.lerpVectors(anim.fP,anim.tP,t); controls.update(); if(t>=1) anim=null; needs=true; }
  if(OLCUM){ if(controls._olcDrag) needs=true; else olcAktif=0;
    if(now-olcT>=1000){ if(olcAktif && olcFr>1){ OLC.fps.push(Math.round(olcFr*1000/(now-olcT))); olcGoster(); } olcFr=0; olcAktif=controls._olcDrag?1:0; olcT=now; } }
  if(!needs) return; needs=false; renderer.render(scene,camera); updateOverlay(); if(OLCUM) olcFr++; }
if(OLCUM){ controls.addEventListener('start',()=>controls._olcDrag=true); controls.addEventListener('end',()=>controls._olcDrag=false); }
requestAnimationFrame(loop);

/* ---------------- modele dokunarak yapi bulma (yalnizca dokununca isin izleme) */
let downAt=null;
canvas.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{ if(!downAt||!cur) return; const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]); downAt=null; if(moved>6) return;
  const r=canvas.getBoundingClientRect(); const v=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  raycaster.setFromCamera(v,camera); const meshes=Object.values(groups).flat().filter(o=>o.visible&&!o.material.userData.text);
  const h=raycaster.intersectObjects(meshes,false).find(x=>clipEl.value>=0.999||clipPlane.distanceToPoint(x.point)>=0); if(!h) return;
  let best=null,bd=1e9; for(const [id,o] of Object.entries(pts)){ const gg=ptGroup(o); if(!(groups[gg]||[]).some(m=>m.visible)) continue; const w=ptOf(o).clone().add(offsetOf(gg,+explodeEl.value)); const d=w.distanceTo(h.point); if(d<bd){bd=d;best=id;} }
  const lim=curKey==='goz'?30:24; if(best&&bd<lim) onPick(best); else tip('Burada adı verilen bir yapı yok. Biraz daha yakına dokun ya da listeden seç.'); });
let tipT=null; function tip(t){ hint.textContent=t; hint.hidden=false; clearTimeout(tipT); tipT=setTimeout(()=>hint.hidden=true,2600); }

/* ---------------- yapiya git: gerekiyorsa modeli acar, kamerayi ceker */
const BOOKPT={beyin:{uc_beyin:[0.5,52,4],beyincik:[0.5,-30,-50]}};
const OUTER_ONLY={beyin:["damarlar"]};
function focusOn(id){ const o=pts[id]; if(!o) return; selected=id; pinName.textContent=M[curKey].s[id][0]; pin.style.setProperty('--c',catColor(id)); pin.hidden=false;
  const st=SET[curKey], inside=(INSIDE[curKey]||[]).includes(id);
  const inBook=(!st.book.hide.includes(o.g) || !!o.pb) && !(OUTER_ONLY[curKey]||[]).includes(id);
  let dir;
  if(inside || (bookMode && inBook)){ bookMode=true;
    const hide=st.book.hide.filter(g=>!(curKey==='goz'&&id==='camsi_cisim'&&g==='camsi')); hideGroups(hide); explodeEl.value=0; applyExplode();
    dir=new THREE.Vector3(...(curKey==='goz'&&['sari_benek','kor_nokta','ag_damarlari','ag_tabaka','damar_tabaka'].includes(id)?[0,0.75,0.65]:st.book.dir)).normalize(); }
  else { bookMode=false; showAll(); if(+explodeEl.value>0 && curKey!=='beyin'){explodeEl.value=0; applyExplode();} dir=o.p.clone().normalize(); if(dir.lengthSq()<0.1) dir=camera.position.clone().normalize(); dir.lerp(camera.position.clone().normalize(),0.35).normalize(); }
  viewBtns();
  const w=ptOf(o).clone().add(offsetOf(ptGroup(o),+explodeEl.value)); const dist=fitDist()*(bookMode?0.62:0.8); const target=w.clone().multiplyScalar(bookMode?0.75:0.6);
  flyTo(target, target.clone().add(dir.multiplyScalar(dist))); }

function tur(){ const T=M[curKey].tur; tourI=Math.min(tourI,T.adimlar.length-1);
  pbody.innerHTML=`<h2>${T.ad}</h2><p class="lead">${T.aciklama}</p>

   <ol class="steps" id="tSteps">${T.adimlar.map(([id,t],i)=>`<li data-i="${i}"><span class="num">${i+1}</span><div><b>${esc(M[curKey].s[id][0])}</b><br>${esc(t)}</div></li>`).join('')}</ol>`;

/* ---------- 3 Yol canlandirma */
let flow=null;
function flowStop(){ if(!flow) return; scene.remove(flow.grp); flow.grp.traverse(o=>{o.geometry&&o.geometry.dispose(); o.material&&o.material.dispose();}); flow=null; req(); }
function flowStart(){ flowStop(); const T=M[curKey].tur.adimlar;
  const P0=T.map(([id])=>pts[id]).filter(Boolean).map(o=>o.p.clone().add(offsetOf(o.g,+explodeEl.value)));
  const eps=fitDist()*0.01, P=[]; P0.forEach(q=>{ if(!P.length||P[P.length-1].distanceTo(q)>eps) P.push(q); }); if(P.length<2) return;
  const curve=new THREE.CatmullRomCurve3(P,false,'catmullrom',0.5); const grp=new THREE.Group(); grp.renderOrder=999;
  const lm=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.55,depthTest:false});
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(240)),lm); line.renderOrder=999; grp.add(line);
  const r=fitDist()*0.008, N=16, dots=[];
  for(let i=0;i<N;i++){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,8),new THREE.MeshBasicMaterial({color:0xffffff,depthTest:false,transparent:true})); m.renderOrder=1000; grp.add(m); dots.push(m); }
  const split={kalp:T.findIndex(a=>a[0]==='akciger_toplardamari')/(T.length-1)}[curKey];
  scene.add(grp); flow={grp,curve,dots,t0:performance.now(),split};
  const tick=now=>{ if(!flow||flow.grp!==grp) return; const u0=Math.max(0,(now-flow.t0)/9000)%1;
    dots.forEach((m,i)=>{ const u=Math.min(0.9999,(u0+i/N)%1); m.position.copy(curve.getPointAt(u));
      const c=curKey==='kalp'?(u<split?0x3b6fe0:0xe0343d):curKey==='goz'?0xffd23f:0xc77dff; m.material.color.setHex(c); });
    req(); requestAnimationFrame(tick); }; requestAnimationFrame(tick); }

const _bul=bul;
function bestGet(){ try{return JSON.parse(localStorage.getItem('bm_best')||'{}')}catch(e){return {}} }
function bestSet(k,v){ const b=bestGet(); b[k]=v; try{localStorage.setItem('bm_best',JSON.stringify(b))}catch(e){} }

const _renderQuiz=renderQuiz;
renderQuiz=function(){ _renderQuiz(); const q=quiz; if(q&&q.i>=q.order.length&&window._qT0){ const sec=Math.round((performance.now()-window._qT0)/1000); window._qT0=null;
  const b=bestGet()[curKey+'_yapi']; const better=!b||q.ok>b.ok||(q.ok===b.ok&&sec<b.s); if(better) bestSet(curKey+'_yapi',{ok:q.ok,s:sec});

function dyStart(){ const L=DY[curKey].slice().sort(()=>Math.random()-.5); let i=0, ok=0;
  const show=()=>{ if(i>=L.length){ const b=bestGet()[curKey+'_dy']; if(b==null||ok>b) bestSet(curKey+'_dy',ok);

    const [t,d,ex,id]=L[i];

/* ---------- 12-14 Goruntu, calisma kagidi, QR posteri */
function snap(withNums){ flowStop(); const tx=[]; if(withNums) Object.values(groups).flat().forEach(o=>{ if(o.material.userData.text&&o.visible){ o.visible=false; tx.push(o);} }); renderer.render(scene,camera); tx.forEach(o=>o.visible=true); req(); const W=canvas.width,H=canvas.height; const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,W,H); g.drawImage(canvas,0,0); const list=[];
  if(withNums){ const r=stage.getBoundingClientRect(), sx=W/r.width; let n=0;
    const meshes=Object.values(groups).flat().filter(o=>o.visible&&!o.material.userData.text), tol=fitDist()*0.12;
    for(const id of Object.keys(pts)){ const q=project(id); if(!q.vis) continue;
      const o=pts[id], w=o.p.clone().add(offsetOf(o.g,+explodeEl.value)), dv=w.clone().sub(camera.position), dist=dv.length(); raycaster.set(camera.position,dv.normalize());
      const h=raycaster.intersectObjects(meshes,false).find(x=>clipEl.value>=0.999||clipPlane.distanceToPoint(x.point)>=0); if(h&&h.distance<dist-tol) continue; n++; list.push(id); const x=q.x*sx,y=q.y*sx, R=11*sx;
      g.beginPath(); g.arc(x,y,R,0,7); g.fillStyle='#111'; g.fill(); g.lineWidth=2*sx; g.strokeStyle='#fff'; g.stroke();
      g.fillStyle='#fff'; g.font=`bold ${12*sx}px sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(String(n),x,y+0.5); } }
  return {url:c.toDataURL('image/png'),list}; }
function openPrint(title,body){ const w=window.open('','_blank'); if(!w){ tip('Açılır pencere engellendi; tarayıcı izin versin.'); return; }
  w.document.write(`<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>${title}</title><style>body{font:14px/1.5 "Segoe UI",Arial,sans-serif;color:#111;margin:24px;max-width:780px}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:18px 0 6px}img{max-width:100%;border:1px solid #ccc;border-radius:6px}
   .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}.ln{border-bottom:1px solid #999;height:22px}.qr{display:inline-block;margin:10px 24px 10px 0;text-align:center}.pb{page-break-before:always}.small{color:#555;font-size:12px}button{margin:10px 0;padding:8px 14px}
   @media print{button{display:none}}</style></head><body>${body}<button onclick="print()">Yazdır</button></body></html>`); w.document.close(); return w; }
function calismaKagidi(){ const d=M[curKey]; const {url,list}=snap(true); if(!list.length){ tip('Görünürde numaralanacak yapı yok; modeli döndürün.'); return; }
  const fn=list.slice().sort(()=>Math.random()-.5).slice(0,Math.min(5,list.length)); const ad=x=>esc(d.s[x][0]);
  const link=(location.protocol.startsWith('http')?location.origin+location.pathname:'')+'#'+curKey;
  const w=openPrint(`${d.ad} – çalışma kâğıdı`,`<h1>BİYOMODÜL · ${d.ad} çalışma kâğıdı</h1><p class="small">Ad Soyad: ……………………… Sınıf: ……… Tarih: ………</p>
   <img src="${url}" alt="${d.ad} modeli, numaralı"><h2>1. Numaralı yapıların adlarını yazın</h2><div class="grid">${list.map((x,i)=>`<div>${i+1}. <span class="ln" style="display:inline-block;width:80%"></span></div>`).join('')}</div>
   <h2>2. Görevi yapıyla eşleştirin (numarasını yazın)</h2>${fn.map(x=>`<p>( …… ) ${esc(d.s[x][1])}</p>`).join('')}
   <h2>3. Merak et</h2>${d.merak.slice(0,2).map(q=>`<p>${esc(q[0])}</p><div class="ln"></div><div class="ln"></div>`).join('')}
   <p class="small">3B modeli incelemek için: ${esc(link)}</p>
   <div class="pb"></div><h1>Cevap anahtarı (öğretmen için)</h1><ol>${list.map(x=>`<li>${ad(x)} <span class="small">(${esc((EN[curKey]||{})[x]||'')})</span></li>`).join('')}</ol>
   <h2>Eşleştirme</h2>${fn.map(x=>`<p>${list.indexOf(x)+1} – ${ad(x)}</p>`).join('')}`); }
function qrData(text){ const d=document.createElement('div'); try{ new QRCode(d,{text,width:360,height:360,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ return ''; } const c=d.querySelector('canvas'); return c?c.toDataURL('image/png'):((d.querySelector('img')||{}).src||''); }
function qrPoster(base){ base=base||(location.protocol.startsWith('http')?location.origin+location.pathname:'https://okulunuz.example/biyomodul/');
  openPrint('BİYOMODÜL QR posteri',`<h1>BİYOMODÜL</h1><p class="small">Oku, dokun, sök, keşfet. Kodu telefonunun kamerasıyla okut.</p>${['kalp','goz','beyin'].map(k=>`<div class="qr"><img src="${qrData(base+'#'+k)}" width="180" height="180" alt="${M[k].ad} QR"><br><b>${M[k].ad}</b></div>`).join('')}<p class="small">${esc(base)}</p>`); }
function goruntuIndir(){ const {url}=snap(false); const a=document.createElement('a'); a.href=url; a.download=`biyomodul_${curKey}.png`; document.body.appendChild(a); a.click(); a.remove(); }

/* ---------- Ogretmen sekmesine araclar */
const _ogretmen=ogretmen;
ogretmen=function(){ _ogretmen(); pbody.insertAdjacentHTML('afterbegin',`<div class="q"><b>Sınıf araçları</b><p class="note">Çalışma kâğıdı, modelin ekrandaki görünümünden numaralı bir şekil oluşturur; cevap anahtarı ikinci sayfadadır. Önce modeli istediğiniz açıya çevirin; yalnızca bu açıdan görünen yapılar numaralanır ve model üzerindeki yazılar şekilde gizlenir. İç yapılar için önce “Kitaptaki görünüm”e geçin.</p>
  <div class="row"><button class="btn pri" id="oCk">Çalışma kâğıdı oluştur</button><button class="btn" id="oQr">QR posteri</button><button class="btn" id="oImg">Görüntüyü indir</button><button class="btn" id="oFs">Sunum modu (tam ekran)</button></div></div>`);
  oCk.onclick=calismaKagidi; oQr.onclick=()=>qrPoster(); oImg.onclick=goruntuIndir; oFs.onclick=tamEkran; };

/* ---------- 5-7 Gorunum: buyuk yazi, yuksek kontrast, tam ekran */
function tamEkran(){ const el=document.documentElement; if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el); } else { document.exitFullscreen&&document.exitFullscreen(); } }
(function(){ const nav=document.querySelector('nav.models'); const box=document.createElement('div'); box.className='acc'; box.setAttribute('role','group'); box.setAttribute('aria-label','Görünüm');
  box.innerHTML=`<button class="btn" id="aBig" aria-pressed="false" title="Büyük yazı">A+</button><button class="btn" id="aHc" aria-pressed="false" title="Yüksek kontrast">Kontrast</button><button class="btn" id="aFs" title="Tam ekran">Tam ekran</button>`;
  nav.after(box);
  const set=(cls,btn,key,on)=>{ document.documentElement.classList.toggle(cls,on); btn.setAttribute('aria-pressed',on); try{localStorage.setItem(key,on?'1':'')}catch(e){} setTimeout(resize,50); };
  let big=false,hc=false; try{ big=!!localStorage.getItem('bm_big'); hc=!!localStorage.getItem('bm_hc'); }catch(e){}
  set('big',aBig,'bm_big',big); set('hc',aHc,'bm_hc',hc);
  aBig.onclick=()=>{big=!big; set('big',aBig,'bm_big',big);}; aHc.onclick=()=>{hc=!hc; set('hc',aHc,'bm_hc',hc);}; aFs.onclick=tamEkran; })();

/* ---------- 15 Yapiya ozel baglanti (#kalp/aort) */
const _initSub=(location.hash.split('/')[1]||'');
if(_initSub){ const iv=setInterval(()=>{ if(loadingEl.hidden&&pts[_initSub]){ clearInterval(iv); setTab('kesfet'); info(_initSub);} },200); }
route=async function(){ const [h,sub]=(location.hash||'#kalp').slice(1).split('/'); const k=M[h]?h:'kalp'; tourI=0; flowStop();
  if(k!==curKey) await show(k); if(sub&&M[k].s[sub]){ setTab('kesfet'); info(sub); } };

/* ---------- 8 Cevrimdisi calisma */
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
