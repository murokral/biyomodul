<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BİYOMODÜL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Yerlesim: ustte marka + model sekmeleri; solda 3B sahne (laboratuvar tezgahi), sagda calisma paneli (sekmeli). Telefonda ust uste. */
:root{
  --bg:#eef2f1; --panel:#ffffff; --ink:#15211f; --muted:#5b6b67; --line:#d5dfdc; --stage:#dfe7e4; --stage2:#c9d6d2;
  --accent:#b23440; --accent-ink:#ffffff; --soft:#f6f8f7; --ok:#1f7a4d; --warn:#9a6200; --bad:#b0302b;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --panel:#16201f; --ink:#e6eeec; --muted:#93a5a0; --line:#28403b; --stage:#1a2725; --stage2:#0e1514;
  --soft:#1c2826; --ok:#4cc38a; --warn:#e3a740; --bad:#ef6b62; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1716; --panel:#16201f; --ink:#e6eeec; --muted:#93a5a0; --line:#28403b; --stage:#1a2725; --stage2:#0e1514;
  --soft:#1c2826; --ok:#4cc38a; --warn:#e3a740; --bad:#ef6b62; color-scheme:dark}
body[data-model="goz"]{--accent:#2c6c9e}
body[data-model="beyin"]{--accent:#7b4fa0}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--panel)}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:800 26px/1 var(--f-display);letter-spacing:-.02em}
.brand b span{color:var(--accent)}
.brand small{color:var(--muted);font-size:13px}
nav.models{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav.models a{text-decoration:none;color:var(--ink);padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
nav.models a .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
nav.models a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{max-width:1400px;margin:0 auto;padding-block:16px 40px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:16px}
@media (max-width:900px){main{grid-template-columns:1fr}}

/* sahne */
.stagebox{position:relative;border-radius:14px;overflow:hidden;background:radial-gradient(120% 90% at 50% 35%,var(--stage),var(--stage2));min-height:420px;height:min(72vh,720px);border:1px solid var(--line)}
@media (max-width:900px){.stagebox{height:62vh;min-height:360px}}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.hud .tag{pointer-events:auto;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:62%}
.hud .tag h1{font:700 20px/1.15 var(--f-display);margin:0;text-wrap:balance}
.hud .tag p{margin:2px 0 0;color:var(--muted);font-size:13px}
.scale{font:500 12px var(--f-mono);color:var(--muted);align-self:flex-start;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 9px;pointer-events:auto}
#markers{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:2px solid #fff;background:var(--accent);color:#fff;
  width:24px;height:24px;border-radius:50%;font:600 11px/20px var(--f-mono);text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:opacity .2s, transform .15s;padding:0}
.mk:hover,.mk.on{transform:translate(-50%,-50%) scale(1.22)}
.mk.hid{opacity:.22}
.mk.on{background:#111;border-color:var(--accent)}
.mk.found{background:var(--ok)}
.mk .lb{position:absolute;left:28px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--panel);color:var(--ink);border:1px solid var(--line);
  font:600 12px var(--f-body);padding:2px 8px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .15s}
.mk:hover .lb,.mk.on .lb,.showlabels .mk:not(.hid) .lb{opacity:1}
.quizmode .mk .lb{opacity:0!important}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600}
.tools{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tools .grp{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.tools label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tools input[type=range]{width:110px;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 11px;font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
@media (max-width:520px){.tools{gap:6px}.tools input[type=range]{width:72px}.tools .grp{padding:5px 8px}.btn{padding:6px 9px;font-size:12px}.hud .tag{max-width:70%}.hud .tag h1{font-size:17px}}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0;height:min(72vh,720px)}
@media (max-width:900px){.panel{height:auto}}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 11px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.pbody{padding:16px;overflow:auto;min-height:0;flex:1}
.pbody h2{font:700 19px/1.2 var(--f-display);margin:0 0 6px;text-wrap:balance}
.pbody h3{font:700 15px/1.3 var(--f-display);margin:16px 0 6px}
.lead{color:var(--muted);margin:0 0 12px;max-width:60ch}
.list{display:flex;flex-direction:column;gap:4px;margin:8px 0 0;padding:0;list-style:none}
.list button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;border:1px solid transparent;background:transparent;padding:7px 8px;border-radius:8px;cursor:pointer}
.list button:hover{background:var(--soft)}
.list button.on{border-color:var(--accent);background:var(--soft)}
.num{font:500 11px/20px var(--f-mono);width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;flex:none}
.seen .num{background:var(--ok)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--soft)}
.card .k{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card h2{margin-top:2px}
.card p{margin:6px 0}
.card .fact{display:flex;gap:8px;font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--panel)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.steps{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:9px;border:1px solid var(--line);font-size:14px}
.steps li.cur{border-color:var(--accent);background:var(--soft)}
.steps li.done{opacity:.6}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.q b{display:block;margin-bottom:4px}
.q details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13px}
.tw{overflow-x:auto}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:13px;color:var(--muted)}
.warnbox{border-left:3px solid var(--warn);padding:8px 12px;background:var(--soft);border-radius:0 8px 8px 0;font-size:13px;margin:10px 0}
.qrbox{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
#qr{background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line);width:max-content}
input[type=text],select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px;width:100%}
.feedback{font-weight:600;min-height:1.5em}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
footer{max-width:1400px;margin:0 auto;padding-block:0 30px;color:var(--muted);font-size:12px}

#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:0;border-left:4px solid var(--c);background:var(--panel);color:var(--ink);
  font:600 11.5px var(--f-body);padding:3px 8px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.25);white-space:nowrap}
#pin{position:absolute;pointer-events:none;width:0;height:0}
#pin .ring{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;border:3px solid var(--c,var(--accent));box-shadow:0 0 0 3px rgba(255,255,255,.85);animation:pulse 1.4s ease-out infinite}
#pin .pl{position:absolute;left:22px;top:-15px;white-space:nowrap;background:var(--c,var(--accent));color:#fff;font:700 13px var(--f-body);padding:5px 10px;border-radius:7px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:.35}}
.hint{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:9px;font-size:13px;max-width:90%;text-align:center}
.cat{display:flex;align-items:center;gap:8px;font-size:12px!important;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cat::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.list .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--c)}
.list button.seen .dot{background:var(--ok);box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--ok)}
.list button.on{border-color:var(--c)}
.card{border-left:4px solid var(--c,var(--accent))}
.card .k{color:var(--c,var(--accent))}
select.mini{width:auto;padding:4px 6px;font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header><div class="hrow wrap">
  <div class="brand"><b>BİYO<span>MODÜL</span></b><small>Oku, dokun, sök, keşfet.</small></div>
  <nav class="models" aria-label="Modeller">
    <a href="#kalp" data-m="kalp" style="--c:#b23440"><span class="dot"></span>Kalp</a>
    <a href="#goz" data-m="goz" style="--c:#2c6c9e"><span class="dot"></span>Göz</a>
    <a href="#beyin" data-m="beyin" style="--c:#7b4fa0"><span class="dot"></span>Beyin</a>
  </nav>
</div></header>

<main class="wrap">
  <section class="stagebox" id="stage" aria-label="3B model sahnesi">
    <canvas id="view"></canvas>
    <div id="labels" hidden></div>
    <div id="pin" hidden><span class="ring"></span><span class="pl" id="pinName"></span></div>
    <div id="hint" class="hint" hidden role="status"></div>
    <div class="loading" id="loading">Model yükleniyor…</div>
    <div class="hud">
      <div class="tag"><h1 id="mtitle">Kalp</h1><p id="msub"></p></div>
      <div class="scale" id="mscale"></div>
    </div>
    <div class="tools">
      <div class="grp"><label for="explode">Parçaları ayır</label><input type="range" id="explode" min="0" max="1" step="0.01" value="0"></div>
      <div class="grp"><label for="clip">Kesit</label><input type="range" id="clip" min="0" max="1" step="0.01" value="1"></div>
      <div class="grp"><label for="textColor">Yazılar</label><select id="textColor" class="mini"><option value="#111111">Siyah</option><option value="#ffffff">Beyaz</option><option value="#ffd23f">Sarı</option><option value="#1e5fd6">Mavi</option></select></div>
      <button class="btn" id="bLabels" aria-pressed="false">Tüm adlar</button>
      <button class="btn" id="bBook">Kitaptaki görünüm</button>
      <button class="btn" id="bReset">Sıfırla</button>
    </div>
  </section>

  <section class="panel" aria-label="Çalışma paneli">
    <div class="tabs" role="tablist">
      <button role="tab" data-t="kesfet" aria-selected="true">Keşfet</button>
      <button role="tab" data-t="tur">Yolculuk</button>
      <button role="tab" data-t="bul">Bul bakalım</button>
      <button role="tab" data-t="merak">Merak et</button>
      <button role="tab" data-t="indir">İndir ve bas</button>
      <button role="tab" data-t="ogretmen">Öğretmen</button>
    </div>
    <div class="pbody" id="pbody"></div>
  </section>
</main>
<footer class="wrap" id="foot"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ======================================================================  ICERIK  */

  beyin:"https://openstax.org/books/anatomy-and-physiology-2e/pages/13-2-the-central-nervous-system"};
const M = {

   koroner:["Koroner damarlar","Kalp kasının kendisini besleyen damarlardır.","Bu damarların tıkanması kalp krizine (miyokart enfarktüsü) yol açar."],
   bolme:["Karıncıklar arası bölme","Sağ ve sol karıncığı ayıran kas duvarıdır.","Böylece oksijence zengin ve fakir kan karışmaz."],

  tur:{ad:"Kanın yolu", aciklama:"Vücuttan gelen kanın kalpten geçip yeniden vücuda gidişini adım adım izle.",

    ["akciger_toplardamari","Oksijence zengin kan akciğer toplardamarlarıyla kalbe döner."],["sol_kulakcik","Kan sol kulakçıkta toplanır."],
    ["mitral","Mitral kapak açılır, kan sol karıncığa geçer."],["sol_karincik","Sol karıncık güçlü bir kasılmayla kanı pompalar."],
    ["aort_kapagi","Kan aort kapağından geçer."],["aort","Aort kanı bütün vücuda dağıtır."]]},
  merak:[["Sol karıncığın duvarı neden sağ karıncıktan kalın? Kanın gittiği mesafeyle ilişkisi ne olabilir?","Modelde iki karıncığın duvar kalınlığını cetvelle ölç ve oranla."],
   ["Kapaklar olmasaydı kalpte ne olurdu?","“Kalp kapak yetmezliği” nedir, araştır."],
   ["Kalp kendi kanını nereden alır?","Koroner damarları modelde bul; “bypass ameliyatı” ne işe yarar, öğren."],

async function loadPoints(){ if(NOKTALAR) return NOKTALAR; try{NOKTALAR=await (await fetch('modeller/noktalar.json')).json();}catch(e){NOKTALAR={kalp:{},goz:{},beyin:{}}} return NOKTALAR;}
const MODEL_URL=k=>`modeller/${k}.glb`;
function loadModel(k){
  return new Promise((res,rej)=>{ if(cache[k]) return res(cache[k]);
    loader.load(MODEL_URL(k), g=>{ g.scene.traverse(o=>{ if(!o.isMesh) return;
        if(!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
        const isText=/yazi/.test(o.name||(o.parent&&o.parent.name)||'');
        const a=o.geometry.attributes.color; let col=new THREE.Color(0xcccccc);
        if(a){ const sc=(a.array instanceof Uint8Array)?1/255:(a.array instanceof Uint16Array)?1/65535:1; col.setRGB(a.getX(0)*sc,a.getY(0)*sc,a.getZ(0)*sc); o.geometry.deleteAttribute('color'); }
        col.convertSRGBToLinear();
        let m;
        if(isText){ m=new THREE.MeshBasicMaterial({color:0x111111,side:THREE.DoubleSide,clippingPlanes:[clipPlane],polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}); m.userData.text=true; }
        else { m=new THREE.MeshLambertMaterial({color:col,side:THREE.DoubleSide,clippingPlanes:[clipPlane]});
          const nm=o.name||''; if(/kornea|mercek|camsi/.test(nm)){m.transparent=true;m.opacity=/camsi/.test(nm)?.3:.55;m.depthWrite=!/camsi/.test(nm);} }
        o.material=m; o.matrixAutoUpdate=true; });
      cache[k]=g.scene; res(g.scene); }, undefined, rej); });
}
function grpName(o){let n=o.name||''; if(!n.includes('|')&&o.parent) n=o.parent.name||''; return n.split('|')[0];}

            else if(k==='goz') g='alt'; else g=p[0]>2?'sol':'sag'; }

function offsetOf(g,t){ const e=SET[curKey].explode[g]; if(!e) return new THREE.Vector3(); return new THREE.Vector3(e[0],e[1],e[2]).normalize().multiplyScalar(e[3]*t); }
function applyExplode(){ const t=+explodeEl.value; for(const [g,arr] of Object.entries(groups)){ const off=offsetOf(g,t); arr.forEach(o=>o.position.copy(o.userData.base).add(off)); } req(); }
function applyClip(){ const st=SET[curKey]; const a=new THREE.Vector3(...st.clipAxis).normalize(); const t=+clipEl.value; const [lo,hi]=st.clipRange;
  clipPlane.normal.copy(a).negate(); clipPlane.constant= t>=0.999 ? 1e5 : lo+(hi-lo)*t; req(); }
function fitDist(){ const b=new THREE.Box3().setFromObject(cur); return b.getSize(new THREE.Vector3()).length()*1.2*Math.max(1,1.15/camera.aspect); }
function showAll(){ Object.values(groups).flat().forEach(o=>o.visible=true); }
function hideGroups(list){ Object.entries(groups).forEach(([g,arr])=>arr.forEach(o=>o.visible=!list.includes(g))); }

/* yumusak kamera gecisi (yalnizca gecis boyunca cizim) */
let anim=null;
function flyTo(target,pos,ms=650){ const t0=performance.now(), fT=controls.target.clone(), fP=camera.position.clone();
  anim={t0,ms,fT,fP,tT:target.clone(),tP:pos.clone()}; req(); }
function setCam(dir,dist,instant){ const d=new THREE.Vector3(...dir).normalize(); camera.near=dist/100; camera.far=dist*20; camera.updateProjectionMatrix();
  const P=d.multiplyScalar(dist); if(instant){ camera.position.copy(P); controls.target.set(0,0,0); controls.update(); req(); } else flyTo(new THREE.Vector3(),P); }
function resetView(instant=true){ showAll(); setCam(SET[curKey].home,fitDist(),instant); }
function bookView(){ hideGroups(SET[curKey].book.hide); explodeEl.value=0; applyExplode(); setCam(SET[curKey].book.dir,fitDist()*0.85); }

/* ---------------- secim isareti (tek, belirgin) ve istege bagli ad etiketleri */
const pin=document.getElementById('pin'), pinName=document.getElementById('pinName'), lblLayer=document.getElementById('labels'); let lblEls={}, selected=null;
function catColor(id){ const c=(CAT[curKey]||{})[id]; return c?CATC[curKey][c][0]:'var(--accent)'; }
function buildLabels(){ lblLayer.innerHTML=''; lblEls={};
  Object.keys(pts).forEach(id=>{ const b=document.createElement('button'); b.type='button'; b.className='lbl'; b.textContent=M[curKey].s[id][0]; b.style.setProperty('--c',catColor(id));
    b.addEventListener('click',e=>{e.stopPropagation(); onPick(id);}); lblLayer.appendChild(b); lblEls[id]=b; }); }
const tmp=new THREE.Vector3();
function project(id){ const o=pts[id]; const w=o.p.clone().add(offsetOf(o.g,+explodeEl.value)); tmp.copy(w).project(camera);
  const r=stage.getBoundingClientRect(); const vis=(groups[o.g]||[]).some(m=>m.visible) && tmp.z<1 && !(clipEl.value<0.999 && clipPlane.distanceToPoint(w)<0);
  return {x:(tmp.x+1)/2*r.width, y:(1-tmp.y)/2*r.height, vis}; }
function updateOverlay(){
  if(selected&&pts[selected]){ const q=project(selected); pin.hidden=!q.vis; pin.style.left=q.x+'px'; pin.style.top=q.y+'px'; }
  if(showLabels){ for(const [id,el] of Object.entries(lblEls)){ const q=project(id); el.style.display=q.vis?'':'none'; el.style.left=q.x+'px'; el.style.top=q.y+'px'; } } }

function loop(now){ requestAnimationFrame(loop);
  if(anim){ let t=Math.min(1,(now-anim.t0)/anim.ms); t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    controls.target.lerpVectors(anim.fT,anim.tT,t); camera.position.lerpVectors(anim.fP,anim.tP,t); controls.update(); if(t>=1) anim=null; needs=true; }
  if(!needs) return; needs=false; renderer.render(scene,camera); updateOverlay(); }
requestAnimationFrame(loop);

/* ---------------- modele dokunarak yapi bulma (yalnizca dokununca isin izleme) */
let downAt=null;
canvas.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{ if(!downAt||!cur) return; const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]); downAt=null; if(moved>6) return;
  const r=canvas.getBoundingClientRect(); const v=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  raycaster.setFromCamera(v,camera); const meshes=Object.values(groups).flat().filter(o=>o.visible&&!o.material.userData.text);
  const h=raycaster.intersectObjects(meshes,false).find(x=>clipEl.value>=0.999||clipPlane.distanceToPoint(x.point)>=0); if(!h) return;
  let best=null,bd=1e9; for(const [id,o] of Object.entries(pts)){ if(!(groups[o.g]||[]).some(m=>m.visible)) continue; const w=o.p.clone().add(offsetOf(o.g,+explodeEl.value)); const d=w.distanceTo(h.point); if(d<bd){bd=d;best=id;} }
  const lim=curKey==='goz'?30:24; if(best&&bd<lim) onPick(best); else tip('Burada adı verilen bir yapı yok. Biraz daha yakına dokun ya da listeden seç.'); });
let tipT=null; function tip(t){ hint.textContent=t; hint.hidden=false; clearTimeout(tipT); tipT=setTimeout(()=>hint.hidden=true,2600); }

/* ---------------- yapiya git: gerekiyorsa modeli acar, kamerayi ceker */
function focusOn(id){ const o=pts[id]; if(!o) return; selected=id; pinName.textContent=M[curKey].s[id][0]; pin.style.setProperty('--c',catColor(id)); pin.hidden=false;
  const inside=(INSIDE[curKey]||[]).includes(id); let dir;
  if(inside){ const hide=SET[curKey].book.hide.filter(g=>!(curKey==='goz'&&id==='camsi_cisim'&&g==='camsi')); hideGroups(hide); explodeEl.value=0; applyExplode(); dir=new THREE.Vector3(...(curKey==='goz'&&['sari_benek','kor_nokta','ag_damarlari','ag_tabaka','damar_tabaka'].includes(id)?[0,0.75,0.65]:SET[curKey].book.dir)).normalize(); }
  else { showAll(); if(+explodeEl.value>0 && curKey!=='beyin'){explodeEl.value=0; applyExplode();} dir=o.p.clone().normalize(); if(dir.lengthSq()<0.1) dir=camera.position.clone().normalize(); dir.lerp(camera.position.clone().normalize(),0.35).normalize(); }
  const w=o.p.clone().add(offsetOf(o.g,+explodeEl.value)); const dist=fitDist()*(inside?0.7:0.8); const target=w.clone().multiplyScalar(0.6);
  flyTo(target, target.clone().add(dir.multiplyScalar(dist))); }

/* ---------------- kesif defteri (yalnizca bu cihazda) */
function seenGet(){ try{return JSON.parse(localStorage.getItem('bm_seen')||'{}')}catch(e){return {}} }
function seenAdd(id){ const s=seenGet(); s[curKey]=s[curKey]||{}; s[curKey][id]=1; try{localStorage.setItem('bm_seen',JSON.stringify(s))}catch(e){} markSeen(); }
function markSeen(){ const s=(seenGet()[curKey])||{}; document.querySelectorAll('[data-sid]').forEach(b=>b.classList.toggle('seen',!!s[b.dataset.sid]));
  const p=document.getElementById('progI'); if(p){ const n=Object.keys(s).filter(k=>pts[k]).length, N=Object.keys(pts).length; p.style.width=(100*n/N)+'%'; progT.textContent=`${n} / ${N} yapı keşfedildi`; } }

/* ======================================================================  PANEL  */
const pbody=document.getElementById('pbody'); let curTab='kesfet', tourI=0, quiz=null, showLabels=false;
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.t)));
function setTab(t){ curTab=t; document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
  if(t!=='bul') quiz=null; if(t==='bul'&&showLabels) toggleLabels(false); ({kesfet,tur,bul,merak,indir,ogretmen})[t](); }
function onPick(id){ seenAdd(id); if(curTab==='bul') return quizAnswer(id); if(curTab!=='kesfet') setTab('kesfet'); info(id); }
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);}
function ids(){ return Object.keys(pts); }

function kesfet(){ const d=M[curKey]; const cats=CATC[curKey];
  const groupsHtml=Object.entries(cats).map(([c,[col,ad]])=>{ const items=ids().filter(id=>(CAT[curKey]||{})[id]===c); if(!items.length) return '';
    return `<h3 style="--c:${col}" class="cat">${ad}</h3><ul class="list">${items.map(id=>`<li><button data-sid="${id}" data-id="${id}" style="--c:${col}"><span class="dot"></span>${esc(d.s[id][0])}</button></li>`).join('')}</ul>`; }).join('');
  pbody.innerHTML=`<h2>${d.ad}: yapıları keşfet</h2><p class="lead">Listeden bir yapı seç ya da modelde bir yere dokun. Seçtiğin yapı işaretlenir, kamera oraya gider; içteki yapılar için model kendiliğinden açılır.</p>
  <div class="prog"><i id="progI"></i></div><div class="note" id="progT"></div>
  <div id="infoBox" style="margin-top:12px"></div>${groupsHtml}`;
  pbody.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>onPick(b.dataset.id)));
  markSeen(); if(selected&&pts[selected]) info(selected,true); }
function info(id,silent){ const s=M[curKey].s[id]; const box=document.getElementById('infoBox'); if(!box) return;
  const c=(CAT[curKey]||{})[id]; const cc=c?CATC[curKey][c]:null;
  box.innerHTML=`<div class="card" style="--c:${cc?cc[0]:'var(--accent)'}">${cc?`<div class="k">${cc[1]}</div>`:''}<h2>${esc(s[0])}</h2><p>${esc(s[1])}</p>${s[2]?`<p class="note">${esc(s[2])}</p>`:''}</div>`;
  pbody.querySelectorAll('[data-id]').forEach(b=>b.classList.toggle('on',b.dataset.id===id)); if(!silent) focusOn(id); box.scrollIntoView({block:'nearest'}); }

function tur(){ const T=M[curKey].tur; tourI=Math.min(tourI,T.adimlar.length-1);
  pbody.innerHTML=`<h2>${T.ad}</h2><p class="lead">${T.aciklama}</p>
   <div class="row"><button class="btn" id="tPrev">Geri</button><button class="btn pri" id="tNext">İleri</button><button class="btn" id="tPlay">Otomatik oynat</button><span class="note" id="tCount"></span></div>
   <ol class="steps" id="tSteps">${T.adimlar.map(([id,t],i)=>`<li data-i="${i}"><span class="num">${i+1}</span><div><b>${esc(M[curKey].s[id][0])}</b><br>${esc(t)}</div></li>`).join('')}</ol>`;
  const go=i=>{ tourI=Math.max(0,Math.min(T.adimlar.length-1,i)); const id=T.adimlar[tourI][0]; focusOn(id); seenAdd(id);
    pbody.querySelectorAll('#tSteps li').forEach(li=>{const j=+li.dataset.i; li.className=j===tourI?'cur':(j<tourI?'done':'');});
    tCount.textContent=`${tourI+1} / ${T.adimlar.length}`; const li=pbody.querySelector(`#tSteps li[data-i="${tourI}"]`); li&&li.scrollIntoView({block:'nearest'}); };
  let timer=null; tPrev.onclick=()=>go(tourI-1); tNext.onclick=()=>go(tourI+1);
  tPlay.onclick=()=>{ if(timer){clearInterval(timer);timer=null;tPlay.textContent='Otomatik oynat';return;} tPlay.textContent='Durdur'; go(0);
    timer=setInterval(()=>{ if(tourI>=T.adimlar.length-1||curTab!=='tur'){clearInterval(timer);timer=null;if(curTab==='tur')tPlay.textContent='Otomatik oynat';return;} go(tourI+1);},3000); };
  pbody.querySelectorAll('#tSteps li').forEach(li=>li.addEventListener('click',()=>go(+li.dataset.i))); go(tourI); }

function bul(){ const all=ids(); const order=all.slice().sort(()=>Math.random()-.5).slice(0,Math.min(8,all.length));
  quiz={order,i:0,ok:0,tries:0}; selected=null; pin.hidden=true; resetView(false); renderQuiz(); }
function renderQuiz(){ const q=quiz; if(!q) return; const d=M[curKey];
  if(q.i>=q.order.length){ pbody.innerHTML=`<h2>Sonuç: ${q.ok} / ${q.order.length}</h2><p class="lead">İlk denemede doğru bulduğun yapı sayısı. Bulamadıklarını “Keşfet” sekmesinde tekrar incele.</p><button class="btn pri" id="qAgain">Yeniden oyna</button>`; qAgain.onclick=bul; return; }
  const id=q.order[q.i];
  pbody.innerHTML=`<h2>Bul bakalım</h2><p class="lead">Modelde istenen yapının üstüne dokun. Modeli döndürebilir, “Parçaları ayır” ya da “Kitaptaki görünüm” ile açabilirsin.</p>
   <div class="card"><div class="k">Soru ${q.i+1} / ${q.order.length}</div><h2>${esc(d.s[id][0])}</h2><p class="note">İpucu: ${esc(d.s[id][1])}</p></div>
   <p class="feedback" id="qFb" aria-live="polite"></p><div class="row"><button class="btn" id="qSkip">Göster ve geç</button><span class="note">Doğru: ${q.ok}</span></div>`;
  qSkip.onclick=()=>{ focusOn(id); q.i++; q.tries=0; setTimeout(()=>{pin.hidden=true;selected=null;renderQuiz();},1800); }; }
function quizAnswer(id){ const q=quiz; if(!q||q.i>=q.order.length) return; const want=q.order[q.i];
  if(id===want){ if(q.tries===0) q.ok++; selected=id; pinName.textContent=M[curKey].s[id][0]; pin.style.setProperty('--c','var(--ok)'); pin.hidden=false; req();
    qFb.textContent='Doğru!'; qFb.className='feedback ok'; q.i++; q.tries=0; setTimeout(()=>{pin.hidden=true;selected=null;renderQuiz();},1000); }
  else { q.tries++; qFb.textContent=`Dokunduğun yer: ${M[curKey].s[id][0]}. Tekrar dene.`; qFb.className='feedback bad'; } }

function merak(){ const d=M[curKey];
  pbody.innerHTML=`<h2>Merak et</h2><p class="lead">Bu soruların cevabı ders kitabında hazır yok. Modeli incele, sonra araştır.</p>
   ${d.merak.map(([q,t],i)=>`<div class="q"><b>${i+1}. ${esc(q)}</b><details><summary>Nereden başlamalı?</summary><p class="note">${esc(t)}</p></details></div>`).join('')}
   <h3>Güvenilir kaynaklar</h3>
   <ul><li><a href="${OPENSTAX[curKey]}" target="_blank" rel="noopener">OpenStax Anatomy and Physiology 2e (İngilizce, ücretsiz)</a></li>
   <li>MEB 11. sınıf Biyoloji ders kitabı (ilgili tema)</li></ul>`; }

function indir(){ const rows=BASKI[curKey];
  pbody.innerHTML=`<h2>İndir ve bas</h2><p class="lead">Her dosya baskı yönüne çevrildi: dilimleyicide döndürmeden tablaya yerleştir.</p>
   <div class="tw"><table><thead><tr><th>Parça</th><th>Ölçü (mm)</th><th>Gram*</th><th>Saat*</th><th>Destek</th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td><a href="indir/${r[1]}" download>${r[0]}</a></td><td class="n">${r[2]}</td><td class="n">${String(r[3]).replace('.',',')}</td><td class="n">${r[4]}</td><td>${r[5]}</td></tr>`).join('')}
   </tbody></table></div>
   <p class="note">* Tahmin: PLA, 1,2 mm dış kabuk, %15 doluluk, 0,2 mm katman. Dilimleyicinin gösterdiği değeri esas al.</p>
   <div class="warnbox" id="dlWarn" hidden>İndirme dosyaları bu önizlemede yok. Sayfa okul sitesine ya da GitHub Pages'e “indir” klasörüyle birlikte yüklendiğinde bağlantılar çalışır.</div>
   <h3>Birleştirme</h3><p>${BIRLESTIR[curKey]}</p>
   <h3>Önerilen ayarlar</h3><ul class="note"><li>0,16 mm katman (yazılı parçalar), 3 duvar, %15 gyroid</li><li>Yavaş ilk katman; yazılar için açık renk filament</li><li>Yazıları ince uçlu permanent kalemle boya; taşan kısmı alkollü pamukla sil</li></ul>
   <h3>Ölçek hesaplayıcı</h3>
   <div class="row" style="align-items:flex-end"><div style="flex:1;min-width:140px"><label for="bed" class="note">Yazıcı tablası</label><select id="bed"><option value="180">180 × 180 mm</option><option value="220" selected>220 × 220 mm</option><option value="256">256 × 256 mm</option><option value="300">300 × 300 mm</option></select></div>
   <div style="flex:1;min-width:140px"><label for="pct" class="note">Ölçek (%)</label><input type="text" id="pct" inputmode="numeric" value="100"></div></div>
   <p id="calc" class="note" aria-live="polite"></p>
   <h3>Bu model için QR kod</h3>
   <div class="qrbox"><div id="qr"></div><div style="flex:1;min-width:180px"><label for="qrUrl" class="note">Sitenin adresi (yayınladıktan sonra düzelt)</label><input type="text" id="qrUrl"><p class="note">QR, telefonda doğrudan bu modeli açar. Basılı modelin tabanına ya da sınıf panosuna yapıştırın.</p></div></div>`;
  const big=Math.max(...rows.map(r=>{const v=r[2].split('×').map(x=>parseFloat(x.replace(',','.'))).filter(x=>!isNaN(x)); return v.length?Math.max(v[0],v[1]):0;}));
  const grams=rows.reduce((a,r)=>a+r[3],0);
  const calcF=()=>{ const bedv=+bed.value; const p=parseFloat(pct.value.replace(',','.')); if(!(p>0)){calc.textContent='Ölçek için 10 ile 200 arasında bir sayı yaz.';return;}
    const fit=Math.floor(bedv/big*100), s=p/100; calc.innerHTML=`En büyük parça ${Math.round(big*s)} mm olur. Bu tablaya en fazla <b>%${fit}</b> ölçek sığar. Toplam filament yaklaşık <b>${Math.round(grams*s*s*s)} g</b>. Ölçeği dilimleyicide “Scale” ayarından uygula.`+(big*s>bedv?` <span style="color:var(--bad);font-weight:600">Bu ölçek tablaya sığmaz.</span>`:''); };
  bed.onchange=calcF; pct.oninput=calcF; calcF();
  const base=(location.protocol.startsWith('http')? location.origin+location.pathname : 'https://okulunuz.example/biyomodul/');
  qrUrl.value=base+'#'+curKey; const mk=()=>{ qr.innerHTML=''; try{ new QRCode(qr,{text:qrUrl.value,width:148,height:148,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ qr.textContent='QR oluşturulamadı.'; } };
  qrUrl.oninput=mk; mk();
  fetch('indir/'+rows[0][1],{method:'HEAD'}).then(r=>{ if(!r.ok) throw 0; }).catch(()=>{ dlWarn.hidden=false; }); }

function ogretmen(){ const d=M[curKey];
  pbody.innerHTML=`<h2>Öğretmen için 30 dakikalık akış</h2><p class="lead">Basılı model ve bu sayfa birlikte kullanılır. Süreler öneridir.</p>
   <ol class="steps">${d.ogr.map(([t,x],i)=>`<li><span class="num">${i+1}</span><div><b>${t}</b><br>${esc(x)}</div></li>`).join('')}</ol>
   <h3>Modelin sınırları</h3><p class="note">${esc(d.kaynak)} Model bir öğretim aracıdır; bazı yapılar sadeleştirildi. Ders kitabındaki terimler esas alındı.</p>
   <h3>Keşif defteri</h3><p class="note">Öğrencinin hangi yapıları açtığı yalnızca kendi cihazında tutulur; hiçbir bilgi sunucuya gönderilmez.</p>`; }

/* ---------------- olaylar ve yonlendirme */
const loadingEl=document.getElementById('loading'), explodeEl=document.getElementById('explode'), clipEl=document.getElementById('clip'), textColorEl=document.getElementById('textColor');
explodeEl.addEventListener('input',applyExplode); clipEl.addEventListener('input',applyClip);
function setTextColor(v){ textMats.forEach(m=>m.color.set(v).convertSRGBToLinear()); req(); try{localStorage.setItem('bm_tc',v)}catch(e){} }
try{ const v=localStorage.getItem('bm_tc'); if(v) textColorEl.value=v; }catch(e){}
textColorEl.addEventListener('change',()=>setTextColor(textColorEl.value));
function toggleLabels(on){ showLabels=on; bLabels.setAttribute('aria-pressed',on); lblLayer.hidden=!on; req(); }
bLabels.onclick=()=>toggleLabels(!showLabels);
bBook.onclick=bookView; bReset.onclick=()=>{explodeEl.value=0;clipEl.value=1;applyExplode();applyClip();selected=null;pin.hidden=true;resetView(false);};
function route(){ const h=(location.hash||'#kalp').slice(1); const k=M[h]?h:'kalp'; tourI=0; if(k!==curKey) show(k); }
window.addEventListener('hashchange',route); route();

</script>
